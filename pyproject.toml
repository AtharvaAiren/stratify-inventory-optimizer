[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "stratify-inventory-optimizer"
version = "1.0.0"
requires-python = ">=3.12"
readme = "README.md"
dependencies = ["numpy>=2.0,<3", "pandas>=2.2,<4", "openpyxl>=3.1,<4"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "ruff>=0.17,<0.18"]

[project.scripts]
inventory = "inventory.__main__:main"

[tool.setuptools.packages.find]
include = ["inventory*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
